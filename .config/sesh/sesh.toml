[[session]]
name = "dotfiles"
path = "~/.dotfiles"

[[session]]
name = "sesh config"
path = "~/.dotfiles/.config/sesh"
startup_command = "vi sesh.toml"

[[session]]
name = "zmk config"
path = "~/git/github/c3smonkey/zmk-config/"
startup_command = "yazi"

[[session]]
name = "Home"
path = "~/"
startup_command = "yazi"

[[session]]
name = "git"
path = "~/git"
# startup_command = "yazi"

[[session]]
name = "tmux config"
path = "~/.dotfiles/.config/tmux"
startup_command = "vi tmux.conf"

[[session]]
name = "gitmux config"
path = "~/.dotfiles/.config/tmux"
startup_command = "vi gitmux.yml"

[[session]]
name = "nvim config"
path = "~/.dotfiles/.config/nvim"
startup_command = "vi init.lua"

[[session]]
name = "skhd config"
path = "~/.dotfiles/.config/skhd"
startup_command = "vi skhdrc"

[[session]]
name = "yabai config"
path = "~/.dotfiles/.config/yabai"
startup_command = "vi yabairc"

[[session]]
name = "aerospace config"
path = "~/.dotfiles/.config/aerospace"
startup_command = "vi aerospace.toml"

[[session]]
name = "zettelkasten"
path = "~/git/github/marzelwidmer/zettelkasten"
startup_command = "yazi"

[[session]]
name = "Downloads"
path = "~/Downloads"
startup_command = "yazi"

[[session]]
name = "alacritty config"
path = "~/.dotfiles/.config/alacritty"
startup_command = "vi alacritty.toml"

[[session]]
name = "wezterm config"
path = "~/.dotfiles/.config/wezterm"
startup_command = "vi wezterm.lua"
